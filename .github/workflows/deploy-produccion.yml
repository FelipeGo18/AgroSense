# Despliegue a producción (HU-235): al fusionar en `produccion` (o a mano), construye la imagen con la web, la sube a
# Artifact Registry, aplica las migraciones con el job `agrosense-migrate` (que antes sube una copia de la base a Cloud
# Storage y, si no puede, no migra) y despliega en Cloud Run. Si la dirección pública no responde, o no responde la
# revisión de este commit, vuelve a la revisión anterior y termina en rojo. La infraestructura está en `infra/`.
#
# Lo que configura el dueño del repositorio (backend/README.md, «Producción en Google Cloud»):
#   - el entorno `produccion`, con la aprobación de Felipe o Haider antes de desplegar, y en él:
#     - variable GCP_WIF_PROVIDER: salida `github_wif_provider` de Terraform
#     - variable GCP_DEPLOY_SA: salida `github_deploy_service_account`
#   - la regla de la rama `produccion`: los mismos checks obligatorios que `desarrollo`.
# No hay llaves JSON: GitHub se identifica con Workload Identity Federation, y solo desde `produccion`.
# Las acciones de terceros van fijadas a un commit exacto, no a una etiqueta que se pueda mover (como en ci.yml).
name: Desplegar a producción

on:
  push:
    branches: [produccion]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: agrosense-prod-2026
  REGION: us-east1
  SERVICE: agrosense
  JOB: agrosense-migrate
  IMAGE: us-east1-docker.pkg.dev/agrosense-prod-2026/agrosense/app:${{ github.sha }}

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Construir y subir la imagen (API + web)
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --target produccion -t "$IMAGE" .
          docker push "$IMAGE"

      # `backend.db.migrate` copia la base y sube la copia al bucket de copias (`AGROSENSE_BACKUP_BUCKET`, 7 días) antes
      # de migrar; si la copia o la subida fallan, no migra y el job termina en rojo.
      - name: Aplicar las migraciones (con copia en Cloud Storage antes)
        run: |
          gcloud run jobs update "$JOB" --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$JOB" --region "$REGION" --wait

      - name: Desplegar en Cloud Run
        id: deploy
        run: |
          # La revisión que sirve hoy (no la última creada: tras volver atrás, la última es la que falló).
          previous="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName][0] // empty')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          # La última revisión creada antes de desplegar: la de este despliegue tiene que ser otra. No se le pone nombre
          # (`--revision-suffix`): Terraform ignora el nombre de la revisión y en su próximo `apply` volvería a mandarlo.
          before="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.latestCreatedRevisionName)')"
          gcloud run services update "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet
          # El tráfico va a la revisión nueva antes de leer nada. Si un despliegue anterior volvió atrás, el tráfico quedó
          # fijo en esa revisión, y entonces `update` termina sin esperar a que la nueva arranque: su estado todavía
          # nombra la vieja (corrida 43778389154), y la nueva no queda lista mientras no le llegue tráfico (corrida
          # 43779100283, 6 minutos esperando). `update-traffic` sí espera a que arranque y falla si no puede; entonces
          # se vuelve a la revisión anterior.
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          # Y se espera a que el servicio termine de aplicar el cambio: que la última creada sea también la última lista.
          for _ in $(seq 60); do
            described="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
            if jq -e '.status.observedGeneration == .metadata.generation
              and .status.latestReadyRevisionName == .status.latestCreatedRevisionName' <<<"$described" > /dev/null; then
              break
            fi
            sleep 5
          done
          revision="$(jq -r '.status.latestCreatedRevisionName' <<<"$described")"
          ready="$(jq -r '.status.latestReadyRevisionName' <<<"$described")"
          if [ "$ready" != "$revision" ]; then
            echo "::error::La revisión nueva ($revision) no quedó lista; la última lista es $ready"
            exit 1
          fi
          # Al repetir la corrida del mismo commit después de volver atrás, la plantilla ya tenía esta imagen y Cloud Run
          # no crea otra revisión: la última ya es la de este commit. La plantilla guarda la etiqueta tal cual.
          template="$(jq -r '.spec.template.spec.containers[0].image' <<<"$described")"
          if [ "$revision" = "$before" ] && [ "$template" != "$IMAGE" ]; then
            echo "::error::No se creó una revisión con la imagen de este commit: la última sigue siendo $before"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Comprobar la dirección pública
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          # La que sirve es la revisión de este despliegue: sigue siendo la última lista y tiene todo el tráfico. Se compara
          # por nombre y no por la imagen: Cloud Run guarda el digest del manifiesto de su plataforma, que no es el que
          # muestra `docker push` (GitHub sube un índice con varias entradas).
          described="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          latest="$(jq -r '.status.latestReadyRevisionName' <<<"$described")"
          serving="$(jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName][0] // empty' <<<"$described")"
          if [ "$latest" != "$REVISION" ] || [ "$serving" != "$REVISION" ]; then
            echo "::error::Debía servir $REVISION; la última lista es $latest y la que tiene el tráfico, $serving"
            exit 1
          fi
          for _ in 1 2 3 4 5; do
            # La API, la web y las cuentas (la base de producción y sus migraciones al día).
            if curl -fsS --max-time 30 "$URL/api/v1/version" > /dev/null \
              && curl -fsS --max-time 30 "$URL/" > /dev/null \
              && curl -fsS --max-time 30 "$URL/api/v1/health" | jq -e '.accounts.available == true' > /dev/null; then
              echo "La API, la web y las cuentas responden en $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL no responde"
          exit 1

      - name: Volver a la revisión anterior
        if: failure() && steps.deploy.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions "$PREVIOUS=100" --quiet
