# Despliegue a producción (HU-235): al fusionar en `produccion` (o a mano), construye la imagen con la web, la sube a
# Artifact Registry, aplica las migraciones con el job `agrosense-migrate` y despliega en Cloud Run. Si la dirección
# pública no responde, vuelve a la revisión anterior y termina en rojo. La infraestructura está en `infra/` (Terraform).
#
# Lo que configura el dueño del repositorio, en el entorno `produccion` de GitHub (con aprobación de Felipe o Haider):
#   - variable GCP_WIF_PROVIDER: salida `github_wif_provider` de Terraform
#   - variable GCP_DEPLOY_SA: salida `github_deploy_service_account`
# No hay llaves JSON: GitHub se identifica con Workload Identity Federation, y solo desde `produccion`.
name: Desplegar a producción

on:
  push:
    branches: [produccion]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: agrosense-prod-2026
  REGION: us-east1
  SERVICE: agrosense
  JOB: agrosense-migrate
  IMAGE: us-east1-docker.pkg.dev/agrosense-prod-2026/agrosense/app:${{ github.sha }}

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir y subir la imagen (API + web)
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --target produccion -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Aplicar las migraciones (con copia antes)
        run: |
          gcloud run jobs update "$JOB" --image "$IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$JOB" --region "$REGION" --wait

      - name: Desplegar en Cloud Run
        id: deploy
        run: |
          # La revisión que sirve hoy (no la última creada: tras volver atrás, la última es la que falló).
          previous="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName][0] // empty')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          gcloud run services update "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet
          # Si un despliegue anterior volvió atrás, el tráfico quedó fijo en esa revisión: se devuelve a la nueva.
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          echo "url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Comprobar la dirección pública
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            # La API, la web y las cuentas (la base de producción y sus migraciones al día).
            if curl -fsS --max-time 30 "$URL/api/v1/version" > /dev/null \
              && curl -fsS --max-time 30 "$URL/" > /dev/null \
              && curl -fsS --max-time 30 "$URL/api/v1/health" | jq -e '.accounts.available == true' > /dev/null; then
              echo "La API, la web y las cuentas responden en $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL no responde"
          exit 1

      - name: Volver a la revisión anterior
        if: failure() && steps.deploy.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions "$PREVIOUS=100" --quiet
