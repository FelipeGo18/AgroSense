# Migraciones de la base de datos (HU-161). Cómo se usan: backend/README.md.
# La dirección de la base de datos no va aquí: sale de las variables de entorno (backend/config/settings.py).

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
path_separator = os
# Migraciones numeradas 1.1, 1.2 … 1.9 y después 2.1. El primer número es la carpeta: 1/, 2/…
# El número lo pone `python -m backend.db.revision` (backend/README.md).
recursive_version_locations = true
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 50
timezone = UTC

[post_write_hooks]
# Cada migración nueva queda con el formato del proyecto.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
