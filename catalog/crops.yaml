# Catálogo agronómico: fichas de los cultivos del MVP (EP-06: HU-061, HU-199, HU-063; specs/02-contratos.md, `crops` y
# `crop_stages`). Versión 0.1.0, armada el 16 de octubre de 2026. PENDIENTE: revisión cruzada por otro integrante.
#
# Regla (R8): cada valor tiene su fuente. Un campo sin fuente va nulo y su señal queda en «datos insuficientes» (R1);
# nunca un valor «típico». Cuando hay una elección entre filas de una fuente, o un supuesto, la nota lo dice.
#
# Formato de cada valor: `campo: {v: valor, s: id de la fuente, n: nota opcional}`.
# Los identificadores (`crop_id`) son los del diseño (design/finca/cultivos.py), decididos el 16 de octubre de 2026.
#
# Aptitud (decisión 13): la temperatura media anual del municipio contra `tmean_*`. Con la UPRA, el óptimo es la
# aptitud alta (A1) y el absoluto va de A3 a A1. Con EcoCrop se usa su rango de temperatura del ciclo, con el supuesto de
# que en el trópico alto la temperatura media del ciclo es casi la media anual (varía poco entre meses).
#
# `article` (HU-191, aprobado por Felipe el 12 de noviembre de 2026 para `specs/02-contratos.md`): el "el"/"la" de cada
# cultivo, para el texto que explica por qué no es apto («la papa», «el maíz»). Es presentación, no un dato agronómico:
# no necesita fuente (R8 no aplica), mismo tipo de campo que `archetype` (aprobado el 16 de oct. para "cómo se dibuja").
# Se descartó redactar la frase sin artículo de género ("el cultivo papa") porque suena forzado y cambiaría los
# ejemplos ya documentados del OpenAPI. Sin este campo, el código antes adivinaba por la terminación del nombre
# (heurística frágil, nunca llegó a producción); ahora, si falta, la API lanza un error explícito en vez de adivinar.

