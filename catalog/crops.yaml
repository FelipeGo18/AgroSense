# Catálogo agronómico: fichas de los cultivos del MVP (EP-06: HU-061, HU-199, HU-063; specs/02-contratos.md, `crops` y
# `crop_stages`). Versión 0.1.0, armada el 16 de octubre de 2026. PENDIENTE: revisión cruzada por otro integrante.
#
# Regla (R8): cada valor tiene su fuente. Un campo sin fuente va nulo y su señal queda en «datos insuficientes» (R1);
# nunca un valor «típico». Cuando hay una elección entre filas de una fuente, o un supuesto, la nota lo dice.
#
# Formato de cada valor: `campo: {v: valor, s: id de la fuente, n: nota opcional}`.
# Los identificadores (`crop_id`) son los del diseño (design/finca/cultivos.py), decididos el 16 de octubre de 2026.
#
# Aptitud (decisión 13): la temperatura media anual del municipio contra `tmean_*`. Con la UPRA, el óptimo es la
# aptitud alta (A1) y el absoluto va de A3 a A1. Con EcoCrop se usa su rango de temperatura del ciclo, con el supuesto de
# que en el trópico alto la temperatura media del ciclo es casi la media anual (varía poco entre meses).

version: "0.1.0"

sources:
  - source_id: fao_ecocrop
    name: "FAO EcoCrop · fichas de datos por especie"
    institution: "Organización de las Naciones Unidas para la Alimentación y la Agricultura (FAO)"
    url: "https://ecocrop.apps.fao.org/ecocrop/srv/en/home"
    downloaded_at: "2026-10-16"
    period_covered: "Base descontinuada hacia 2015; se consulta por la plataforma GAEZ"
    coverage: "Mundial"
    license: "CC BY 4.0 (catálogo de datos de la FAO)"
    notes: "Rangos óptimos y absolutos de temperatura, lluvia anual y pH; temperaturas que matan la planta; duración del ciclo; familia. La propia FAO advierte que son opinión experta. Cada ficha se cita con su URL."
  - source_id: fao_56
    name: "FAO-56: Crop evapotranspiration (Allen, Pereira, Raes y Smith, 1998). Tablas 11 y 12"
    institution: "FAO"
    url: "https://www.fao.org/4/x0490e/x0490e0b.htm"
    downloaded_at: "2026-10-16"
    period_covered: "1998"
    coverage: "Mundial (cada fila de la tabla 11 dice su región)"
    license: "Publicación de la FAO, uso con cita"
    notes: "Duración de las 4 etapas (inicial, desarrollo, media y final) y coeficientes de cultivo Kc. El Kc inicial que no aparece en la fila del cultivo es el de su grupo (por ejemplo, raíces y tubérculos 0,5)."
  - source_id: upra_papa_diacol
    name: "UPRA: Cultivo de papa Diacol Capiro para uso industrial, identificación de zonas aptas en Colombia, escala 1:100.000"
    institution: "Unidad de Planificación Rural Agropecuaria (UPRA), Ministerio de Agricultura"
    url: "https://upra.gov.co/sites/default/files/2025-07/Zonas_aptas_papa_Diacol.pdf"
    downloaded_at: "2026-10-16"
    period_covered: "Temperatura del Ideam, promedio 1981-2010"
    coverage: "Colombia"
    license: "Propiedad de la UPRA; reproducción parcial sin fines comerciales con cita"
    notes: "Anexo 1.1.1, temperatura media anual (p. 127): alta 12-15 °C, media 10-12 y 15-16 °C, baja 8-10 °C, no apta < 8 y > 16 °C."
  - source_id: upra_cebolla_bulbo
    name: "UPRA: Cultivo comercial de cebolla de bulbo, identificación de zonas aptas en Colombia, escala 1:100.000"
    institution: "Unidad de Planificación Rural Agropecuaria (UPRA), Ministerio de Agricultura"
    url: "https://upra.gov.co/sites/default/files/2025-07/Zonas_aptas_cebollabulbo.pdf"
    downloaded_at: "2026-10-16"
    period_covered: "Temperatura del Ideam, promedio 1981-2010"
    coverage: "Colombia"
    license: "Propiedad de la UPRA; reproducción parcial sin fines comerciales con cita"
    notes: "Anexo 1.1.1.1, temperatura media anual (p. 145): alta > 20 y < 28 °C, media de 10 a 20 °C, baja ≥ 28 °C, no apta < 10 °C. No pone límite superior de exclusión."
  - source_id: fao_iyp_2019
    name: "FAO: The International Year of Pulses, final report (2019)"
    institution: "FAO"
    url: "https://openknowledge.fao.org/items/a5ba05a4-314c-4d73-a47e-1dd8c6021258"
    downloaded_at: "2026-10-16"
    period_covered: "2016-2019"
    coverage: "Mundial"
    license: "Publicación de la FAO, uso con cita"
    notes: "Las legumbres, y las leguminosas en general, fijan nitrógeno del aire y mejoran el suelo."
  - source_id: fews_net_wrsi
    name: "FEWS NET · Water Requirement Satisfaction Index (WRSI) y sus clases"
    institution: "Famine Early Warning Systems Network (FEWS NET) y USGS; clases publicadas por el Banco Mundial"
    url: "https://earlywarning.usgs.gov/fews/product/890"
    downloaded_at: "2026-11-10"
    period_covered: null
    coverage: "Mundial (pensado para cultivos de secano en África)"
    license: "Información pública del USGS; las clases, del catálogo de datos del Banco Mundial (CC BY 4.0)"
    notes: "Para los cortes de la señal de agua en backend/config/thresholds.yaml (HU-075). El WRSI es la evapotranspiración real de la temporada sobre la que pide el cultivo, por 100: «A case of 'no deficit' will result in a WRSI value of 100» y «A seasonal WRSI value less than 50 is regarded as a crop failure condition (Smith, 1992)» (USGS). Clases del Banco Mundial (https://datacatalog.worldbank.org/search/dataset/0066866/gridded-dekadal-water-requirement-satisfaction-index-wrsi-for-africa): < 50 Failure; 50-60 Poor; 60-80 Mediocre; 80-95 Average; 95-99 Good; 99-100 Very Good. Es una fuente derivada: solo vale si la cobertura de agua de AgroSense se calcula igual (HU-144)."
  - source_id: mapa_zarc_2025
    name: "Zoneamento Agrícola de Risco Climático (ZARC): Portaria SPA/MAPA n.º 388, del 21 de agosto de 2025"
    institution: "Ministério da Agricultura e Pecuária (MAPA), Brasil"
    url: "https://www.gov.br/agricultura/pt-br/assuntos/riscos-seguro/programa-nacional-de-zoneamento-agricola-de-risco-climatico/portarias/2025-2026/minas-gerais-mg/POF5FF1.PDF"
    downloaded_at: "2026-11-10"
    period_covered: "Ciclo 2025-2026"
    coverage: "Brasil (Minas Gerais, maíz de segunda cosecha)"
    license: "Acto oficial del gobierno de Brasil, publicado en el Diário Oficial"
    notes: "Para los cortes de la señal de heladas en backend/config/thresholds.yaml (HU-075). Punto 1.6: tres niveles de riesgo, «20%, 30%, 40%». Punto 1.9.a.1: la helada es la probabilidad de «temperaturas mínimas menores ou igual a 2°C». El ZARC acepta pérdidas en hasta 2 de cada 10 años (Santos y Martins, 2016, Revista de Política Agrícola XXV(3), https://rpa.sede.embrapa.br/RPA/article/download/1157/pdf/2423). Es una fuente derivada y de otro país: el 20/30/40 es el riesgo de todas las amenazas juntas, no solo de la helada. Respaldo cercano: Le Tacon (IRD), «Los riesgos de helada en el altiplano boliviano», planea la papa con un riesgo de helada del 25 % (https://horizon.documentation.ird.fr/exl-doc/pleins_textes/divers09-11/38556.pdf)."
  - source_id: fao_soils_bulletin_55
    name: "FAO Soils Bulletin 55: Guidelines, land evaluation for irrigated agriculture (1985), formato 5"
    institution: "FAO"
    url: "https://www.fao.org/4/x5648e/x5648e05.htm"
    downloaded_at: "2026-11-10"
    period_covered: "1985"
    coverage: "Mundial"
    license: "Publicación de la FAO, uso con cita"
    notes: "Para los cortes de nivel 70 y 40 de backend/config/thresholds.yaml (HU-075). Rendimiento relativo por clase de aptitud: S1 de 1,0 a 0,9; S2 de 0,9 a 0,7; S3 de 0,7 a 0,6; N1 de 0,6 a 0,4; N2 menos de 0,4. La nota 3 dice: «Relative yields indicated are examples only». Es un respaldo débil: en AgroSense los cortes 70 y 40 son una convención."
  - source_id: agrosense_diseno
    name: "Catálogo visual de AgroSense (design/finca/cultivos.py)"
    institution: "Equipo RealE4Life"
    url: "https://github.com/FelipeGo18/AgroSense/blob/desarrollo/design/finca/cultivos.py"
    downloaded_at: "2026-10-16"
    period_covered: null
    coverage: "AgroSense"
    license: "Del proyecto"
    notes: "Solo para cómo se dibuja cada cultivo (`archetype`) y su nombre en la web. No es un dato agronómico."

crops:
  - crop_id: papa
    name_es: {v: "Papa", s: agrosense_diseno}
    kind: {v: crop, s: agrosense_diseno}
    archetype: {v: tuber, s: agrosense_diseno}
    species: "Solanum tuberosum"
    ecocrop_url: "https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=1971"
    family: {v: Solanaceae, s: fao_ecocrop}
    fixes_nitrogen: {v: false, s: fao_ecocrop, n: "No es leguminosa (familia Solanaceae)."}
    water_need: {v: null, n: "Sin fuente para una categoría de necesidad de agua; el agua de la ventana sale de los Kc de FAO-56."}
    root_type: {v: null, n: "Pendiente de HU-062 (alternar tipo de raíz): falta la fuente de la clasificación."}
    tmean_min_c: {v: 8, s: upra_papa_diacol, n: "Límite inferior de la aptitud baja (A3)."}
    tmean_max_c: {v: 16, s: upra_papa_diacol, n: "Límite superior de la aptitud media (A2); por encima es no apta."}
    tmean_opt_min_c: {v: 12, s: upra_papa_diacol, n: "Aptitud alta (A1)."}
    tmean_opt_max_c: {v: 15, s: upra_papa_diacol, n: "Aptitud alta (A1). La zonificación es de Diacol Capiro; se usa para la papa en general hasta tener la de otras variedades."}
    temp_min_c: {v: 7, s: fao_ecocrop}
    temp_opt_min_c: {v: 15, s: fao_ecocrop}
    temp_opt_max_c: {v: 25, s: fao_ecocrop}
    heat_max_c: {v: 30, s: fao_ecocrop, n: "Máximo absoluto de la temperatura del ciclo en EcoCrop. Supuesto por confirmar en HU-190: se compara con la máxima diaria que se supera uno de cada diez días."}
    rain_min_mm: {v: 250, s: fao_ecocrop}
    rain_opt_min_mm: {v: 500, s: fao_ecocrop}
    rain_opt_max_mm: {v: 800, s: fao_ecocrop}
    rain_max_mm: {v: 2000, s: fao_ecocrop}
    ph_min: {v: 4.2, s: fao_ecocrop}
    ph_opt_min: {v: 5.0, s: fao_ecocrop}
    ph_opt_max: {v: 6.2, s: fao_ecocrop}
    ph_max: {v: 8.5, s: fao_ecocrop}
    base_temp_c: {v: null, n: "Sin fuente de temperatura base; los grados-día son P1 (HU-150)."}
    frost_killing_c: {v: 0, s: fao_ecocrop, n: "Temperatura que mata la planta en crecimiento temprano (-1 °C en reposo)."}
    stages:
      source_row: "FAO-56, tabla 11, papa, fila «Idaho, USA» (siembra abril/mayo): la más larga de la tabla, la más cercana a los ciclos largos del clima frío. Por confirmar con una fuente local de la papa del altiplano."
      kc_source_row: "FAO-56, tabla 12: papa (Kc media 1,15 y final 0,75); Kc inicial del grupo raíces y tubérculos (0,5)."
      frost_sensitive_note: "Supuesto por confirmar: sensible a la helada en todas las etapas, porque EcoCrop da 0 °C como temperatura que la mata en crecimiento."
      list:
        - {stage: initial, days: 45, kc: 0.5, s: fao_56, frost_sensitive: true}
        - {stage: development, days: 30, kc: null, s: fao_56, frost_sensitive: true, n: "En FAO-56 el Kc sube en línea recta de la inicial a la media."}
        - {stage: mid, days: 70, kc: 1.15, s: fao_56, frost_sensitive: true}
        - {stage: late, days: 20, kc: 0.75, s: fao_56, frost_sensitive: true, n: "Kc al final de la etapa; en FAO-56 baja en línea recta desde la media."}

