crops:
  - crop_id: papa
    name_es: {v: "Papa", s: agrosense_diseno}
    article: {v: "la", s: agrosense_diseno}
    kind: {v: crop, s: agrosense_diseno}
    archetype: {v: tuber, s: agrosense_diseno}
    species: "Solanum tuberosum"
    ecocrop_url: "https://ecocrop.apps.fao.org/ecocrop/srv/en/dataSheet?id=1971"
    family: {v: Solanaceae, s: fao_ecocrop}
    fixes_nitrogen: {v: false, s: fao_ecocrop, n: "No es leguminosa (familia Solanaceae)."}
    water_need: {v: null, n: "Sin fuente para una categoría de necesidad de agua; el agua de la ventana sale de los Kc de FAO-56."}
    root_type: {v: null, n: "Pendiente de HU-062 (alternar tipo de raíz): falta la fuente de la clasificación."}
    tmean_min_c: {v: 8, s: upra_papa_diacol, n: "Límite inferior de la aptitud baja (A3)."}
    tmean_max_c: {v: 16, s: upra_papa_diacol, n: "Límite superior de la aptitud media (A2); por encima es no apta."}
    tmean_opt_min_c: {v: 12, s: upra_papa_diacol, n: "Aptitud alta (A1)."}
    tmean_opt_max_c: {v: 15, s: upra_papa_diacol, n: "Aptitud alta (A1). La zonificación es de Diacol Capiro; se usa para la papa en general hasta tener la de otras variedades."}
    temp_min_c: {v: 7, s: fao_ecocrop}
    temp_opt_min_c: {v: 15, s: fao_ecocrop}
    temp_opt_max_c: {v: 25, s: fao_ecocrop}
    heat_max_c: {v: 30, s: fao_crop_info_potato, n: "Sobre 30 °C el crecimiento del tubérculo se frena en seco («Tuber growth is sharply inhibited when below 10°C and above 30°C», FAO Crop Information). Coincide con el máximo absoluto de EcoCrop. Más prudente que el estrés por calor de 35 °C de FAO-66: se deja en 30 °C (decidido por Felipe el 14 nov 2026, PR #69). Se compara con la máxima que se supera uno de cada diez días."}
    rain_min_mm: {v: 250, s: fao_ecocrop}
    rain_opt_min_mm: {v: 500, s: fao_ecocrop}
    rain_opt_max_mm: {v: 800, s: fao_ecocrop}
    rain_max_mm: {v: 2000, s: fao_ecocrop}
    ph_min: {v: 4.2, s: fao_ecocrop}
    ph_opt_min: {v: 5.0, s: fao_ecocrop}
    ph_opt_max: {v: 6.2, s: fao_ecocrop}
    ph_max: {v: 8.5, s: fao_ecocrop}
    base_temp_c: {v: null, n: "Sin fuente de temperatura base; los grados-día son P1 (HU-150)."}
    frost_killing_c: {v: 0, s: fao_ecocrop, n: "Temperatura que mata la planta en crecimiento temprano (-1 °C en reposo)."}
    stages:
