="round"/><path d="M156 34 C172 36 188 26 188 12 C172 10 158 20 156 34Z" fill="#8CC56A" stroke="#1D1D1B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 28 C142 24 136 18 132 10 M146 16 L136 22 M178 14 C172 22 166 28 158 32 M172 28 L166 16" fill="none" stroke="#1D1D1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M158 58 C196 62 216 98 212 132 C208 168 184 188 156 188 C126 188 104 166 102 134 C100 98 122 60 158 58Z" fill="#C8873A" stroke="#1D1D1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 92 A46 46 0 0 1 164 70" fill="none" stroke="#E3AE68" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 128 C114 150 124 168 140 178" fill="none" stroke="#1D1D1B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/><path d="M146 66 Q158 78 170 64" fill="none" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="124" cy="142" rx="9" ry="5" fill="#E76F51" opacity="0.55"/><ellipse cx="196" cy="142" rx="9" ry="5" fill="#E76F51" opacity="0.55"/><path d="M126 122 Q140 100 154 122" fill="none" stroke="#1D1D1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M168 122 Q182 100 196 122" fill="none" stroke="#1D1D1B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 144 Q160 186 190 144Z" fill="#FFF6E0" stroke="#1D1D1B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M146 162 Q160 172 176 162" fill="#E76F51"/><path d="M208 126 C238 112 250 88 248 62" fill="none" stroke="#1D1D1B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="248" cy="58" r="13" fill="#FFF6E0" stroke="#1D1D1B" stroke-width="4"/></g><path d="M46 48 Q46 60 58 60 Q46 60 46 72 Q46 60 34 60 Q46 60 46 48Z" fill="#E76F51"/><path d="M262 87 Q262 96 271 96 Q262 96 262 105 Q262 96 253 96 Q262 96 262 87Z" fill="#E76F51"/><path d="M238 206 Q238 214 246 214 Q238 214 238 222 Q238 214 230 214 Q238 214 238 206Z" fill="#E76F51"/><path d="M74 20 Q74 26 80 26 Q74 26 74 32 Q74 26 68 26 Q74 26 74 20Z" fill="#2A9D8F"/></g><g id="tarjeta" transform="translate(12 236)"><polygon points="18,8 348,8 366,26 366,888 348,906 18,906 0,888 0,26" fill="#B4C3CC"/><polygon points="18,0 348,0 366,18 366,880 348,898 18,898 0,880 0,18" fill="#FFFFFF"/></g><g id="contenido" transform="translate(12 236)"><text x="22" y="54" font-family="Atkinson Hyperlegible" font-weight="700" font-size="15" fill="#4A6576" text-anchor="start">CREAR CUENTA</text><text x="22" y="100" font-family="Fredoka" font-weight="600" font-size="30" fill="#1E2A3A" text-anchor="start">Guarde su finca</text><text x="22" y="138" font-family="Atkinson Hyperlegible" font-weight="400" font-size="16" fill="#1E2A3A" text-anchor="start">Solo un nombre, un usuario y una contraseña.</text><g id="campo-nombre" transform="translate(22 184)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">¿Cómo quiere que lo llamemos?</text><polygon points="11.5,13.5 310.5,13.5 320.5,23.5 320.5,56.5 310.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 310,16 307,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Rosa</text></g><g id="campo-usuario" transform="translate(22 288)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Usuario</text><polygon points="11.5,13.5 310.5,13.5 320.5,23.5 320.5,56.5 310.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 310,16 307,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">rosa.samaca</text><text x="0" y="90" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Con este usuario va a entrar.</text></g><g id="campo-contrasena" transform="translate(22 416)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Contraseña</text><polygon points="11.5,13.5 310.5,13.5 320.5,23.5 320.5,56.5 310.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 310,16 307,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">••••••••••</text><rect x="116.6" y="30" width="2" height="24" fill="#1E2A3A"/><text x="302" y="48" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="end">Mostrar</text><text x="0" y="90" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Elija una que recuerde: no se puede recuperar.</text></g><g id="consentimiento" transform="translate(22 536)"><polygon points="12,0 310,0 322,12 322,204 310,216 12,216 0,204 0,12" fill="#DCE5EA"/><g id="casilla" transform="translate(16 16)"><polygon points="7.5,1.5 24.5,1.5 30.5,7.5 30.5,24.5 24.5,30.5 7.5,30.5 1.5,24.5 1.5,7.5" fill="#55692B" stroke="#55692B" stroke-width="3" stroke-linejoin="round"/><polyline points="8,16 14,22 24,10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="62" y="36" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">Acepto que AgroSense guarde</text><text x="62" y="59" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">mi usuario, mi nombre, mis lotes</text><text x="62" y="82" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">y lo que siembro, para mostrarme</text><text x="62" y="105" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">mi finca. No se guarda correo,</text><text x="62" y="128" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">celular, documento ni dirección.</text><text x="62" y="151" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">Puedo borrar todo cuando quiera.</text><text x="62" y="182" font-family="Atkinson Hyperlegible" font-weight="700" font-size="15" fill="#55692B" text-anchor="start">Leer la política de datos</text><rect x="62" y="186" width="210" height="2" fill="#55692B"/></g><g id="boton-primary" transform="translate(22 774)"><polygon points="10,6 312,6 322,16 322,48 312,58 10,58 0,48 0,16" fill="#3A4A1D"/><polygon points="10,0 312,0 322,10 322,42 312,52 10,52 0,42 0,10" fill="#55692B"/><polygon points="10,0 10,52 0,42 0,10" fill="#697B44"/><polygon points="312,0 322,10 322,42 312,52" fill="#4B5C26"/><polygon points="10,0 76.44,0 43.22,52" fill="#5F7238"/><polygon points="10,0 43.22,52 10,52" fill="#54672A"/><polygon points="76.44,0 151.94,0 115.7,52" fill="#5B6E32"/><polygon points="76.44,0 115.7,52 43.22,52" fill="#516429"/><polygon points="151.94,0 224.42,0 191.2,52" fill="#586B2E"/><polygon points="151.94,0 191.2,52 115.7,52" fill="#52662A"/><polygon points="224.42,0 312,0 269.72,52" fill="#5D7035"/><polygon points="224.42,0 269.72,52 191.2,52" fill="#4F6228"/><polygon points="312,0 312,52 269.72,52" fill="#55692B"/><text x="161" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Crear cuenta</text></g><text x="22" y="868" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">¿Ya tiene cuenta?</text><text x="180" y="868" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#55692B" text-anchor="start">Entrar</text><rect x="180" y="872" width="60.48" height="2" fill="#55692B"/></g></svg>