FF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 628,16 625,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Mi finca</text></g><text x="40" y="298" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Samacá, Boyacá · 3,00 ha · sin riego</text><g id="temporadas" transform="translate(40 318)"><polygon points="10,0 630,0 640,10 640,40 630,50 10,50 0,40 0,10" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round"/><text x="16" y="22" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Papa</text><text x="16" y="40" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">1,50 ha · desde el 2 ago 2026</text><text x="624" y="31" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="end">Sin diagnóstico al sembrar</text><polygon points="10,58 630,58 640,68 640,98 630,108 10,108 0,98 0,68" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round"/><text x="16" y="80" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Arveja</text><text x="16" y="98" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">0,90 ha · desde el 1 sep 2026</text><text x="624" y="89" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="end">Sin diagnóstico al sembrar</text><polygon points="10,116 630,116 640,126 640,156 630,166 10,166 0,156 0,126" fill="#DCE5EA" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="16" y="138" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Libre</text><text x="16" y="156" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">0,60 ha · en descanso</text></g><text x="40" y="516" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Puede dibujarlo en el mapa después; mientras tanto se usa el suelo del municipio. Lo</text><text x="40" y="537" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">puede editar o borrar cuando quiera.</text><g id="boton-primary" transform="translate(40 578)"><polygon points="10,6 302,6 312,16 312,48 302,58 10,58 0,48 0,16" fill="#3A4A1D"/><polygon points="10,0 302,0 312,10 312,42 302,52 10,52 0,42 0,10" fill="#55692B"/><polygon points="10,0 10,52 0,42 0,10" fill="#697B44"/><polygon points="302,0 312,10 312,42 302,52" fill="#4B5C26"/><polygon points="10,0 74.24,0 42.12,52" fill="#5F7238"/><polygon points="10,0 42.12,52 10,52" fill="#54672A"/><polygon points="74.24,0 147.24,0 112.2,52" fill="#5B6E32"/><polygon points="74.24,0 112.2,52 42.12,52" fill="#516429"/><polygon points="147.24,0 217.32,0 185.2,52" fill="#586B2E"/><polygon points="147.24,0 185.2,52 112.2,52" fill="#52662A"/><polygon points="217.32,0 302,0 261.12,52" fill="#5D7035"/><polygon points="217.32,0 261.12,52 185.2,52" fill="#4F6228"/><polygon points="302,0 302,52 261.12,52" fill="#55692B"/><text x="156" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Guardar como lote</text></g><g id="boton-secondary" transform="translate(368 578)"><polygon points="10,6 302,6 312,16 312,48 302,58 10,58 0,48 0,16" fill="#B8862E"/><polygon points="10,0 302,0 312,10 312,42 302,52 10,52 0,42 0,10" fill="#E8B04B"/><polygon points="10,0 10,52 0,42 0,10" fill="#EBB961"/><polygon points="302,0 312,10 312,42 302,52" fill="#CC9B42"/><polygon points="10,0 74.24,0 42.12,52" fill="#E9B556"/><polygon points="10,0 42.12,52 10,52" fill="#E5AD4A"/><polygon po