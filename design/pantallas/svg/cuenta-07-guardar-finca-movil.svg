<svg xmlns="http://www.w3.org/2000/svg" width="390" height="939" viewBox="0 0 390 939"><rect width="390" height="939" fill="#DCE5EA"/><rect width="390" height="2000" fill="#DCE5EA"/><g id="barra" transform="translate(0 0)"><polygon points="24,18 366,18 378,30 378,62 366,74 24,74 12,62 12,30" fill="#B4C3CC"/><polygon points="24,12 366,12 378,24 378,56 366,68 24,68 12,56 12,24" fill="#FFFFFF"/><g id="marca" transform="translate(26 18)"><path d="M16 9c9 .6 13 9 12 17-.8 8-7 12-13 12S3 34 2 26C1 17 7 9 16 9z" fill="#C8873A" stroke="#1D1D1B" stroke-width="2.5"/><path d="M15 9c-5 0-7-4-6-7 4 .6 7 3 6 7zm2 0c4 .6 8-2 8-6-4-.6-7 2-8 6z" fill="#5FA052" stroke="#1D1D1B" stroke-width="2"/><text x="40" y="33" font-family="Fredoka" font-weight="600" font-size="28" fill="#1E2A3A" text-anchor="start">AgroSense</text></g><g id="boton-sonido" transform="translate(268 18)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#DCE5EA"/><polygon points="11,18 17,18 25,11 25,33 17,26 11,26" fill="#1E2A3A"/><path d="M30 16 L38 28 M38 16 L30 28" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g><g id="boton-modo-ligero" transform="translate(220 20)"><polygon points="10.5,1.5 29.5,1.5 38.5,10.5 38.5,29.5 29.5,38.5 10.5,38.5 1.5,29.5 1.5,10.5" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="2.5" stroke-linejoin="round"/><g transform="translate(9 9) scale(1.1)"><path d="M3 18 C2 9 8 2 18 2 C18 12 12 18 3 18Z" fill="none" stroke="#1E2A3A" stroke-width="2.2" stroke-linejoin="round"/><path d="M2 19 L12 8" fill="none" stroke="#1E2A3A" stroke-width="2.2" stroke-linecap="round"/></g></g><polygon points="330,27 356,27 358,29 358,30 356,32 330,32 328,30 328,29" fill="#1E2A3A"/><polygon points="330,37 356,37 358,39 358,40 356,42 330,42 328,40 328,39" fill="#1E2A3A"/><polygon points="330,47 356,47 358,49 358,50 356,52 330,52 328,50 328,49" fill="#1E2A3A"/></g><g id="tarjeta" transform="translate(16 100)"><polygon points="18,8 340,8 358,26 358,769 340,787 18,787 0,769 0,26" fill="#B4C3CC"/><polygon points="18,0 340,0 358,18 358,761 340,779 18,779 0,761 0,18" fill="#FFFFFF"/></g><g id="guardar-finca" transform="translate(16 100)"><text x="20" y="52" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#4A6576" text-anchor="start">CUENTA CREADA</text><text x="20" y="92" font-family="Fredoka" font-weight="600" font-size="26" fill="#1E2A3A" text-anchor="start">¿Guardamos su finca?</text><text x="20" y="124" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">Antes de crear la cuenta llenó una finca.</text><text x="20" y="146" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">Se guardaría como un lote sin dibujar.</text><g id="campo-nombre" transform="translate(20 194)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Nombre del lote</text><polygon points="11.5,13.5 306.5,13.5 316.5,23.5 316.5,56.5 306.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 306,16 303,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Mi finca</text></g><text x="20" y="298" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Samacá, Boyacá · 3,00 ha · sin riego</text><g id="temporadas" transform="translate(20 318)"><polygon points="10,0 308,0 318,10 318,40 308,50 10,50 0,40 0,10" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round"/><text x="16" y="22" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Papa</text><text x="16" y="40" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">1,50 ha · desde el 2 ago 2026</text><text x="302" y="31" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="end">Sin diagnóstico al sembrar</text><polygon points="10,58 308,58 318,68 318,98 308,108 10,108 0,98 0,68" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round"/><text x="16" y="80" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Arveja</text><text x="16" y="98" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">0,90 ha · desde el 1 sep 2026</text><text x="302" y="89" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="end">Sin diagnóstico al sembrar</text><polygon points="10,116 308,116 318,126 318,156 308,166 10,166 0,156 0,126" fill="#DCE5EA" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="16" y="138" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Libre</text><text x="16" y="156" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">0,60 ha · en descanso</text></g><text x="20" y="516" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Puede dibujarlo en el mapa después; mientras</text><text x="20" y="537" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">tanto se usa el suelo del municipio. Lo</text><text x="20" y="558" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">puede editar o borrar cuando quiera.</text><g id="boton-primary" transform="translate(20 599)"><polygon points="10,6 308,6 318,16 318,48 308,58 10,58 0,48 0,16" fill="#3A4A1D"/><polygon points="10,0 308,0 318,10 318,42 308,52 10,52 0,42 0,10" fill="#55692B"/><polygon points="10,0 10,52 0,42 0,10" fill="#697B44"/><polygon points="308,0 318,10 318,42 308,52" fill="#4B5C26"/><polygon points="10,0 75.56,0 42.78,52" fill="#5F7238"/><polygon points="10,0 42.78,52 10,52" fill="#54672A"/><polygon points="75.56,0 150.06,0 114.3,52" fill="#5B6E32"/><polygon points="75.56,0 114.3,52 42.78,52" fill="#516429"/><polygon points="150.06,0 221.58,0 188.8,52" fill="#586B2E"/><polygon points="150.06,0 188.8,52 114.3,52" fill="#52662A"/><polygon points="221.58,0 308,0 266.28,52" fill="#5D7035"/><polygon points="221.58,0 266.28,52 188.8,52" fill="#4F6228"/><polygon points="308,0 308,52 266.28,52" fill="#55692B"/><text x="159" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Guardar como lote</text></g><g id="boton-secondary" transform="translate(20 669)"><polygon points="10,6 308,6 318,16 318,48 308,58 10,58 0,48 0,16" fill="#B8862E"/><polygon points="10,0 308,0 318,10 318,42 308,52 10,52 0,42 0,10" fill="#E8B04B"/><polygon points="10,0 10,52 0,42 0,10" fill="#EBB961"/><polygon points="308,0 318,10 318,42 308,52" fill="#CC9B42"/><polygon points="10,0 75.56,0 42.78,52" fill="#E9B556"/><polygon points="10,0 42.78,52 10,52" fill="#E5AD4A"/><polygon points="75.56,0 150.06,0 114.3,52" fill="#E9B351"/><polygon points="75.56,0 114.3,52 42.78,52" fill="#DCA747"/><polygon points="150.06,0 221.58,0 188.8,52" fill="#E8B14E"/><polygon points="150.06,0 188.8,52 114.3,52" fill="#E1AB49"/><polygon points="221.58,0 308,0 266.28,52" fill="#E9B453"/><polygon points="221.58,0 266.28,52 188.8,52" fill="#D9A546"/><polygon points="308,0 308,52 266.28,52" fill="#E8B04B"/><text x="159" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="middle">No guardarla</text></g><text x="20" y="753" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">«No guardarla» la descarta: no queda guardada en ningún lado.</text></g></svg>