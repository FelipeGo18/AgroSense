<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1129" viewBox="0 0 390 1129"><rect width="390" height="1129" fill="#DCE5EA"/><rect width="390" height="2000" fill="#DCE5EA"/><g id="barra" transform="translate(0 0)"><polygon points="24,18 366,18 378,30 378,62 366,74 24,74 12,62 12,30" fill="#B4C3CC"/><polygon points="24,12 366,12 378,24 378,56 366,68 24,68 12,56 12,24" fill="#FFFFFF"/><g id="marca" transform="translate(26 18)"><path d="M16 9c9 .6 13 9 12 17-.8 8-7 12-13 12S3 34 2 26C1 17 7 9 16 9z" fill="#C8873A" stroke="#1D1D1B" stroke-width="2.5"/><path d="M15 9c-5 0-7-4-6-7 4 .6 7 3 6 7zm2 0c4 .6 8-2 8-6-4-.6-7 2-8 6z" fill="#5FA052" stroke="#1D1D1B" stroke-width="2"/><text x="40" y="33" font-family="Fredoka" font-weight="600" font-size="28" fill="#1E2A3A" text-anchor="start">AgroSense</text></g><g id="boton-modo-ligero" transform="translate(272 18)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(0 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g></g><polygon points="330,27 356,27 358,29 358,30 356,32 330,32 328,30 328,29" fill="#1E2A3A"/><polygon points="330,37 356,37 358,39 358,40 356,42 330,42 328,40 328,39" fill="#1E2A3A"/><polygon points="330,47 356,47 358,49 358,50 356,52 330,52 328,50 328,49" fill="#1E2A3A"/></g><text x="16" y="118" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="start">‹ Samacá, Boyacá</text><rect x="16" y="122" width="143.36" height="2" fill="#55692B"/><g id="tarjeta" transform="translate(12 140)"><polygon points="18,8 348,8 366,26 366,929 348,947 18,947 0,929 0,26" fill="#B4C3CC"/><polygon points="18,0 348,0 366,18 366,921 348,939 18,939 0,921 0,18" fill="#FFFFFF"/></g><g id="panel" transform="translate(1 140)"><text x="22" y="44" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#4A6576" text-anchor="start">PASO 2 DE 2</text><text x="22" y="82" font-family="Fredoka" font-weight="600" font-size="26" fill="#1E2A3A" text-anchor="start">Su lote, sin dibujar</text><g id="formulario" transform="translate(0 126)"><g id="campo-area" transform="translate(22 0)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Área del lote (ha)</text><polygon points="11.5,13.5 334.5,13.5 344.5,23.5 344.5,56.5 334.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 334,16 331,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">2,5</text><rect x="51.08" y="30" width="2" height="24" fill="#1E2A3A"/><text x="0" y="90" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">En hectáreas. Una hectárea son 10.000 m².</text></g><g id="sin-ubicacion" transform="translate(22 128)"><polygon points="10,0 336,0 346,10 346,121 336,131 10,131 0,121 0,10" fill="#E6F0F5" stroke="#4A6576" stroke-width="1.5" stroke-linejoin="round"/><text x="16" y="30" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#1E2A3A" text-anchor="start">Sin dibujo, su lote queda sin ubicación:</text><text x="16" y="51" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#1E2A3A" text-anchor="start">· No sale en el mapa de su finca.</text><text x="16" y="72" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#1E2A3A" text-anchor="start">· El suelo y la altitud son los de Samacá,</text><text x="16" y="93" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#1E2A3A" text-anchor="start">  no los de su lote.</text><text x="16" y="114" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#1E2A3A" text-anchor="start">Puede dibujarlo después, cuando quiera.</text></g><g id="campo-nombre" transform="translate(22 289)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Nombre del lote</text><polygon points="11.5,13.5 334.5,13.5 344.5,23.5 344.5,56.5 334.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 334,16 331,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">La Esperanza</text></g><g id="pregunta-riego" transform="translate(22 401)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">¿Este lote tiene riego?</text><g id="eleccion" transform="translate(0 0)"><polygon points="10,16 97.3333,16 107.333,26 107.333,54 97.3333,64 10,64 0,54 0,26" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="2.5" stroke-linejoin="round"/><text x="53.6667" y="47" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="middle">Sí</text><polygon points="129.333,16 216.667,16 226.667,26 226.667,54 216.667,64 129.333,64 119.333,54 119.333,26" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="2.5" stroke-linejoin="round"/><text x="173" y="47" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="middle">No</text><polygon points="248.667,16 336,16 346,26 346,54 336,64 248.667,64 238.667,54 238.667,26" fill="#55692B"/><text x="292.333" y="47" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">Todavía no sé</text></g><text x="0" y="88" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Con riego, la falta de lluvia no se cuenta como</text><text x="0" y="108" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">riesgo; le mostramos una estimación, en rangos,</text><text x="0" y="128" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">de cuánto riego haría falta. Puede cambiarlo</text><text x="0" y="148" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">después.</text></g><text x="22" y="595" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">¿Ya sembró algo en este lote?</text><g id="opciones" transform="translate(0 0)"><g id="eleccion" transform="translate(0 0)"><polygon points="32,611 179,611 189,621 189,649 179,659 32,659 22,649 22,621" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="2.5" stroke-linejoin="round"/><text x="105.5" y="642" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="middle">Sí</text><polygon points="211,611 358,611 368,621 368,649 358,659 211,659 201,649 201,621" fill="#55692B"/><text x="284.5" y="642" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Todavía no</text></g></g><g id="boton-primary" transform="translate(22 687)"><polygon points="10,6 336,6 346,16 346,48 336,58 10,58 0,48 0,16" fill="#3A4A1D"/><polygon points="10,0 336,0 346,10 346,42 336,52 10,52 0,42 0,10" fill="#55692B"/><polygon points="10,0 10,52 0,42 0,10" fill="#697B44"/><polygon points="336,0 346,10 346,42 336,52" fill="#4B5C26"/><polygon points="10,0 81.72,0 45.86,52" fill="#5F7238"/><polygon points="10,0 45.86,52 10,52" fill="#54672A"/><polygon points="81.72,0 163.22,0 124.1,52" fill="#5B6E32"/><polygon points="81.72,0 124.1,52 45.86,52" fill="#516429"/><polygon points="163.22,0 241.46,0 205.6,52" fill="#586B2E"/><polygon points="163.22,0 205.6,52 124.1,52" fill="#52662A"/><polygon points="241.46,0 336,0 290.36,52" fill="#5D7035"/><polygon points="241.46,0 290.36,52 205.6,52" fill="#4F6228"/><polygon points="336,0 336,52 290.36,52" fill="#55692B"/><text x="173" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Guardar lote</text></g><text x="22" y="775" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#55692B" text-anchor="start">Dibujar en el mapa</text><rect x="22" y="779" width="181.44" height="2" fill="#55692B"/></g></g></svg>