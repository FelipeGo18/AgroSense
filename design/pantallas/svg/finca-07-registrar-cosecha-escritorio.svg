ándo cosechó?</text><polygon points="11.5,13.5 556.5,13.5 566.5,23.5 566.5,56.5 556.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 556,16 553,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">22 de diciembre de 2026</text><text x="548" y="48" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="end">▾</text><text x="0" y="90" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">La cosecha estimada era el 28 de diciembre</text></g><text x="36" y="300" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Con la cosecha, esta parte del lote queda libre y la papa pasa al</text><text x="36" y="322" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">historial. Puede corregir la fecha después.</text><g id="boton-primary" transform="translate(36 360)"><polygon points="10,6 558,6 568,16 568,48 558,58 10,58 0,48 0,16" fill="#3A4A1D"/><polygon points="10,0 558,0 568,10 568,42 558,52 10,52 0,42 0,10" fill="#55692B"/><polygon points="10,0 10,52 0,42 0,10" fill="#697B44"/><polygon points="558,0 568,10 568,42 558,52" fill="#4B5C26"/><polygon points="10,0 130.56,0 70.28,52" fill="#5F7238"/><polygon points="10,0 70.28,52 10,52" fill="#54672A"/><polygon points="130.56,0 267.56,0 201.8,52" fill="#5B6E32"/><polygon points="130.56,0 201.8,52 70.28,52" fill="#516429"/><polygon points="267.56,0 399.08,0 338.8,52" fill="#586B2E"/><polygon points="267.56,0 338.8,52 201.8,52" fill="#52662A"/><polygon points="399.08,0 558,0 481.28,52" fill="#5D7035"/><polygon points="399.08,0 481.28,52 338.8,52" fill="#4F6228"/><polygon points="558,0 558,52 481.28,52" fill="#55692B"/><text x="284" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#FFFFFF" text-anchor="middle">Guardar cosecha y registrar la siembra</text></g><text x="36" y="450" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="start">Guardar solo la cosecha</text><rect x="36" y="454" width="206.08" height="2" fill="#55692B"/><text x="604" y="450" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="end">Cancelar</text><rect x="532.32" y="454" width="71.68" height="2" fill="#55692B"/></g><g id="tarjeta-reparto" transform="translate(712 172)"><polygon points="18,8 662,8 680,26 680,242 662,260 18,260 0,242 0,26" fill="#B4C3CC"/><polygon points="18,0 662,0 680,18 680,234 662,252 18,252 0,234 0,18" fill="#FFFFFF"/></g><g id="reparto" transform="translate(712 172)"><text x="24" y="40" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#4A6576" text-anchor="start">CÓMO QUEDA EL LOTE</text><text x="24" y="72" font-family="Fredoka" font-weight="600" font-size="20" fill="#1E2A3A" text-anchor="start">Después de cosechar la papa</text><g id="reparto-del-lote" transform="translate(24 96)"><rect x="0.0" y="0" width="314.3" height="40" fill="#F0913A" stroke="#1E2A3A" stroke-width="2"/><text x="157.129" y="25" font-family="Atkinson Hyperlegible" font-weight="700" font-size="13" fill="#1E2A3A" text-anchor="middle">Libre</text><text x="157.129" y="58" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="middle">1,26 ha</text><rect x="317.3" y="0" width="102.8" height="40" fill="#DCEBC2" stroke="#B4C3CC" stroke-width="1.5"/><text x="368.635" y="25" font-family="Atkinson Hyperlegible" font-weight="700" font-size="13" fill="#1E2A3A" text-anchor="middle">Haba</text><text x="368.635" y="58" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="middle">0,42 ha</text><rect x="423.0" y="0" width="102.8" height="40" fill="