x="241" y="26" font-family="Atkinson Hyperlegible" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle">2 · Siembra</text></g><text x="20" y="110" font-family="Fredoka" font-weight="600" font-size="26" fill="#1E2A3A" text-anchor="start">Registrar la siembra</text><g id="antes-en-este-terreno" transform="translate(20 160)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">¿Qué había antes en este terreno?</text><text x="0" y="24" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Marque una o varias. Si junta terrenos,</text><text x="0" y="44" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">márquelos todos.</text><polygon points="10,68 308,68 318,78 318,116 308,126 10,126 0,116 0,78" fill="#FFF6EA" stroke="#F0913A" stroke-width="2" stroke-linejoin="round"/><g id="casilla-papa" transform="translate(14 81)"><polygon points="7.5,1.5 24.5,1.5 30.5,7.5 30.5,24.5 24.5,30.5 7.5,30.5 1.5,24.5 1.5,7.5" fill="#55692B" stroke="#55692B" stroke-width="3" stroke-linejoin="round"/><polyline points="8,16 14,22 24,10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58" y="93" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Papa</text><text x="58" y="113" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">1,26 ha · cosechada el 22 dic 2026</text><polygon points="10,136 308,136 318,146 318,184 308,194 10,194 0,184 0,146" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round"/><g id="casilla-papa-criolla" transform="translate(14 149)"><polygon points="7.5,1.5 24.5,1.5 30.5,7.5 30.5,24.5 24.5,30.5 7.5,30.5 1.5,24.5 1.5,7.5" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/></g><text x="58" y="161" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Papa criolla</text><text x="58" y="181" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">0,41 ha · cosechada el 15 jun 2026 · libre</text><polygon points="10,204 308,204 318,214 318,252 308,262 10,262 0,252 0,214" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="1.5" stroke-linejoin="round"/><g id="casilla-nada:-es-la-primera-siembra-aquí" transform="translate(14 217)"><polygon points="7.5,1.5 24.5,1.5 30.5,7.5 30.5,24.5 24.5,30.5 7.5,30.5 1.5,24.5 1.5,7.5" fill="#FFFFFF" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/></g><text x="58" y="229" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Nada: es la primera siembra aquí</text><text x="58" y="249" font-family="Atkinson Hyperlegible" font-weight="400" font-size="13" fill="#4A6576" text-anchor="start">Tierra del lote que no había sembrado</text><text x="0" y="284" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Para dividirlo en dos cultivos, registre uno y luego</text><text x="0" y="304" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">el otro marcando el mismo terreno.</text></g><g id="campo-cultivo" transform="translate(20 510)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Cultivo</text><polygon points="11.5,13.5 306.5,13.5 316.5,23.5 316.5,56.5 306.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 306,16 303,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Arveja</text><text x="298" y="48" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="end">▾</text></g><text x="20" y="602" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#55692B" text-anchor="start">Ver qué conviene sembrar aquí</text><rect x="20" y="606" width="227.36" height="2" fill="#55692B"/><g id="campo-area" transform="translate(20 646)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Área que siembra (ha)</text><polygon points="11.5,13.5 306.5,13.5 316.5,23.5 316.5,56.5 306.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#A93226" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 306,16 303,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">1,80</text><text x="0" y="90" font-family="Atkinson Hyperlegible" font-weight="700" font-size="15" fill="#A93226" text-anchor="start">Solo hay 1,67 ha libres en el lote</text></g><g id="campo-fecha-siembra" transform="translate(20 766)"><text x="0" y="0" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="start">Fecha de siembra</text><polygon points="11.5,13.5 306.5,13.5 316.5,23.5 316.5,56.5 306.5,66.5 11.5,66.5 1.5,56.5 1.5,23.5" fill="#FFFFFF" stroke="#B4C3CC" stroke-width="3" stroke-linejoin="round"/><polygon points="12,16 306,16 303,20 15,20" fill="#DCE5EA"/><text x="20" y="48" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">15 de enero de 2027</text><text x="298" y="48" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#55692B" text-anchor="end">▾</text></g><g id="diagnostico-visto" transform="translate(20 888)"><polygon points="10,0 308,0 318,10 318,138 308,148 10,148 0,138 0,10" fill="#E9F2D8" stroke="#55692B" stroke-width="1.5" stroke-linejoin="round"/><polygon points="21,63 31,63 