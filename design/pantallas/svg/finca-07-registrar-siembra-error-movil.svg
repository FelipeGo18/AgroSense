sform="translate(16 1358)"><text x="24" y="40" font-family="Atkinson Hyperlegible" font-weight="700" font-size="14" fill="#4A6576" text-anchor="start">CÓMO QUEDA EL LOTE</text><text x="24" y="72" font-family="Fredoka" font-weight="600" font-size="20" fill="#1E2A3A" text-anchor="start">No cabe en el lote</text><g id="reparto-del-lote" transform="translate(24 96)"><rect x="0.0" y="0" width="208.4" height="40" fill="#F0913A" stroke="#1E2A3A" stroke-width="2"/><text x="104.182" y="25" font-family="Atkinson Hyperlegible" font-weight="700" font-size="13" fill="#1E2A3A" text-anchor="middle">Arveja</text><text x="104.182" y="58" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="middle">1,80 ha</text><rect x="211.4" y="0" width="46.3" height="40" fill="#DCEBC2" stroke="#B4C3CC" stroke-width="1.5"/><text x="234.523" y="25" font-family="Atkinson Hyperlegible" font-weight="700" font-size="13" fill="#1E2A3A" text-anchor="middle">Haba</text><text x="234.523" y="58" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="middle">0,42 ha</text><rect x="260.7" y="0" width="46.3" height="40" fill="#DCEBC2" stroke="#B4C3CC" stroke-width="1.5"/><text x="283.841" y="25" font-family="Atkinson Hyperlegible" font-weight="700" font-size="13" fill="#1E2A3A" text-anchor="middle">Cebolla</text><text x="283.841" y="58" font-family="Atkinson Hyperlegible" font-weight="400" font-size="12" fill="#4A6576" text-anchor="middle">0,42 ha</text></g><text x="24" y="190" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">1,80 + 0,42 + 0,42 = 2,64 ha, y el lote</text><text x="24" y="211" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">tiene 2,51 ha.</text><text x="24" y="232" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Baje el área a 1,67 ha o menos.</text></g></svg>