<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="994" viewBox="0 0 1440 994"><rect width="1440" height="994" fill="#DCE5EA"/><g id="barra" transform="translate(0 0)"><polygon points="46,26 1394,26 1408,40 1408,76 1394,90 46,90 32,76 32,40" fill="#B4C3CC"/><polygon points="46,20 1394,20 1408,34 1408,70 1394,84 46,84 32,70 32,34" fill="#FFFFFF"/><g id="marca" transform="translate(56 30)"><path d="M16 9c9 .6 13 9 12 17-.8 8-7 12-13 12S3 34 2 26C1 17 7 9 16 9z" fill="#C8873A" stroke="#1D1D1B" stroke-width="2.5"/><path d="M15 9c-5 0-7-4-6-7 4 .6 7 3 6 7zm2 0c4 .6 8-2 8-6-4-.6-7 2-8 6z" fill="#5FA052" stroke="#1D1D1B" stroke-width="2"/><text x="40" y="33" font-family="Fredoka" font-weight="600" font-size="28" fill="#1E2A3A" text-anchor="start">AgroSense</text></g><text x="300" y="60" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Consultar</text><text x="434.72" y="60" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Mi finca</text><text x="559.36" y="60" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Cómo funciona</text><g id="boton-modo-ligero" transform="translate(1056 30)"><polygon points="9,0 155,0 164,9 164,35 155,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(6 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g><text x="56" y="29" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Modo ligero</text></g><g id="boton-secondary" transform="translate(1244 26)"><polygon points="10,6 130,6 140,16 140,48 130,58 10,58 0,48 0,16" fill="#B8862E"/><polygon points="10,0 130,0 140,10 140,42 130,52 10,52 0,42 0,10" fill="#E8B04B"/><polygon points="10,0 10,52 0,42 0,10" fill="#EBB961"/><polygon points="130,0 140,10 140,42 130,52" fill="#CC9B42"/><polygon points="10,0 36.4,0 23.2,52" fill="#E9B556"/><polygon points="10,0 23.2,52 10,52" fill="#E5AD4A"/><polygon points="36.4,0 66.4,0 52,52" fill="#E9B351"/><polygon points="36.4,0 52,52 23.2,52" fill="#DCA747"/><polygon points="66.4,0 95.2,0 82,52" fill="#E8B14E"/><polygon points="66.4,0 82,52 52,52" fill="#E1AB49"/><polygon points="95.2,0 130,0 113.2,52" fill="#E9B453"/><polygon points="95.2,0 113.2,52 82,52" fill="#D9A546"/><polygon points="130,0 130,52 113.2,52" fill="#E8B04B"/><text x="70" y="33" font-family="Atkinson Hyperlegible" font-weight="700" font-size="18" fill="#1E2A3A" text-anchor="middle">Entrar</text></g></g><g id="aviso-modo-ligero" transform="translate(1096 98)"><polygon points="12,6 276,6 288,18 288,134 276,146 12,146 0,134 0,18" fill="#B4C3CC"/><polygon points="12,0 276,0 288,12 288,128 276,140 12,140 0,128 0,12" fill="#FFFFFF"/><text x="20" y="36" font-family="Fredoka" font-weight="600" font-size="19" fill="#1E2A3A" text-anchor="start">Modo ligero: desactivado</text><text x="20" y="64" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">Quita las animaciones y el scroll</text><text x="20" y="85" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">suave. La información es la misma.</text><text x="20" y="120" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Toque para activarlo.</text></g><text x="56" y="300" font-family="Fredoka" font-weight="600" font-size="40" fill="#1E2A3A" text-anchor="start">Modo ligero</text><text x="56" y="340" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">La misma información, sin animaciones ni scroll suave.</text><text x="56" y="366" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Para celulares básicos o con poca señal.</text><text x="56" y="416" font-family="Fredoka" font-weight="600" font-size="24" fill="#1E2A3A" text-anchor="start">Estados del botón</text><g id="estado-desactivado-texto" transform="translate(56 444)"><polygon points="9,0 155,0 164,9 164,35 155,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(6 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g><text x="56" y="29" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Modo ligero</text></g><text x="56" y="510" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Desactivado</text><g id="estado-activado-texto" transform="translate(260 444)"><polygon points="9,0 155,0 164,9 164,35 155,44 9,44 0,35 0,9" fill="#55692B"/><g transform="translate(6 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#55692B" stroke-width="3" stroke-linecap="round"/></g><text x="56" y="29" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="start">Modo ligero</text></g><text x="260" y="510" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Activado</text><g id="estado-desactivado-icono" transform="translate(56 544)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(0 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g></g><text x="56" y="610" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Desactivado · solo ícono</text><g id="estado-activado-icono" transform="translate(260 544)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#55692B"/><g transform="translate(0 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#55692B" stroke-width="3" stroke-linecap="round"/></g></g><text x="260" y="610" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Activado · solo ícono</text><text x="56" y="652" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Con texto desde 1280 px. Debajo, solo el ícono; el nombre sale en el aviso.</text><text x="56" y="704" font-family="Fredoka" font-weight="600" font-size="24" fill="#1E2A3A" text-anchor="start">Qué se apaga</text><text x="56" y="754" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Scroll</text><text x="276" y="754" font-family="Atkinson Hyperlegible" font-weight="400" font-size="17" fill="#1E2A3A" text-anchor="start">Normal del navegador, sin inercia ni recorrido.</text><text x="56" y="790" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Portada</text><text x="276" y="790" font-family="Atkinson Hyperlegible" font-weight="400" font-size="17" fill="#1E2A3A" text-anchor="start">Quieta: la Tierra no gira y la mascota no vuela.</text><text x="56" y="826" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Secciones</text><text x="276" y="826" font-family="Atkinson Hyperlegible" font-weight="400" font-size="17" fill="#1E2A3A" text-anchor="start">Ya están colocadas: nada aparece ni se desliza.</text><text x="56" y="862" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Mascota y botones</text><text x="276" y="862" font-family="Atkinson Hyperlegible" font-weight="400" font-size="17" fill="#1E2A3A" text-anchor="start">Sin parpadeo, vaivén ni transiciones.</text><text x="56" y="914" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Automático por defecto: sigue a «reducir movimiento» y al ahorro de datos del equipo.</text><text x="56" y="936" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">La persona lo puede forzar en uno u otro sentido y se guarda en el dispositivo.</text></svg>