<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1094" viewBox="0 0 390 1094"><rect width="390" height="1094" fill="#DCE5EA"/><g id="barra" transform="translate(0 0)"><polygon points="24,18 366,18 378,30 378,62 366,74 24,74 12,62 12,30" fill="#B4C3CC"/><polygon points="24,12 366,12 378,24 378,56 366,68 24,68 12,56 12,24" fill="#FFFFFF"/><g id="marca" transform="translate(26 18)"><path d="M16 9c9 .6 13 9 12 17-.8 8-7 12-13 12S3 34 2 26C1 17 7 9 16 9z" fill="#C8873A" stroke="#1D1D1B" stroke-width="2.5"/><path d="M15 9c-5 0-7-4-6-7 4 .6 7 3 6 7zm2 0c4 .6 8-2 8-6-4-.6-7 2-8 6z" fill="#5FA052" stroke="#1D1D1B" stroke-width="2"/><text x="40" y="33" font-family="Fredoka" font-weight="600" font-size="28" fill="#1E2A3A" text-anchor="start">AgroSense</text></g><g id="boton-modo-ligero" transform="translate(272 18)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(0 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g></g><polygon points="330,27 356,27 358,29 358,30 356,32 330,32 328,30 328,29" fill="#1E2A3A"/><polygon points="330,37 356,37 358,39 358,40 356,42 330,42 328,40 328,39" fill="#1E2A3A"/><polygon points="330,47 356,47 358,49 358,50 356,52 330,52 328,50 328,49" fill="#1E2A3A"/></g><g id="aviso-modo-ligero" transform="translate(90 84)"><polygon points="12,6 276,6 288,18 288,134 276,146 12,146 0,134 0,18" fill="#B4C3CC"/><polygon points="12,0 276,0 288,12 288,128 276,140 12,140 0,128 0,12" fill="#FFFFFF"/><text x="20" y="36" font-family="Fredoka" font-weight="600" font-size="19" fill="#1E2A3A" text-anchor="start">Modo ligero: desactivado</text><text x="20" y="64" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">Quita las animaciones y el scroll</text><text x="20" y="85" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#1E2A3A" text-anchor="start">suave. La información es la misma.</text><text x="20" y="120" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Toque para activarlo.</text></g><text x="24" y="290" font-family="Fredoka" font-weight="600" font-size="32" fill="#1E2A3A" text-anchor="start">Modo ligero</text><text x="24" y="330" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">La misma información, sin</text><text x="24" y="356" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">animaciones ni scroll suave.</text><text x="24" y="382" font-family="Atkinson Hyperlegible" font-weight="400" font-size="18" fill="#1E2A3A" text-anchor="start">Para celulares básicos o con poca señal.</text><text x="24" y="432" font-family="Fredoka" font-weight="600" font-size="24" fill="#1E2A3A" text-anchor="start">Estados del botón</text><g id="estado-desactivado-texto" transform="translate(24 460)"><polygon points="9,0 155,0 164,9 164,35 155,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(6 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g><text x="56" y="29" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#1E2A3A" text-anchor="start">Modo ligero</text></g><text x="24" y="526" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Desactivado</text><g id="estado-activado-texto" transform="translate(212 460)"><polygon points="9,0 155,0 164,9 164,35 155,44 9,44 0,35 0,9" fill="#55692B"/><g transform="translate(6 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#55692B" stroke-width="3" stroke-linecap="round"/></g><text x="56" y="29" font-family="Atkinson Hyperlegible" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="start">Modo ligero</text></g><text x="212" y="526" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Activado</text><g id="estado-desactivado-icono" transform="translate(24 560)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#DCE5EA"/><g transform="translate(0 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="none" stroke="#1E2A3A" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#1E2A3A" stroke-width="3" stroke-linecap="round"/></g></g><text x="24" y="626" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Desactivado · solo ícono</text><g id="estado-activado-icono" transform="translate(212 560)"><polygon points="9,0 35,0 44,9 44,35 35,44 9,44 0,35 0,9" fill="#55692B"/><g transform="translate(0 0)"><path d="M31 11C21 11 14 17 12 27l-1 5 5-1c10-2 16-9 15-20z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M12 32 25 19" stroke="#55692B" stroke-width="3" stroke-linecap="round"/></g></g><text x="212" y="626" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Activado · solo ícono</text><text x="24" y="668" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">Con texto desde 1280 px. Debajo, solo</text><text x="24" y="688" font-family="Atkinson Hyperlegible" font-weight="400" font-size="14" fill="#4A6576" text-anchor="start">el ícono; el nombre sale en el aviso.</text><text x="24" y="728" font-family="Fredoka" font-weight="600" font-size="24" fill="#1E2A3A" text-anchor="start">Qué se apaga</text><text x="24" y="794" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Scroll</text><text x="24" y="816" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Normal del navegador, sin inercia ni recorrido.</text><text x="24" y="846" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Portada</text><text x="24" y="868" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Quieta: la Tierra no gira y la mascota no vuela.</text><text x="24" y="898" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Secciones</text><text x="24" y="920" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Ya están colocadas: nada aparece ni se desliza.</text><text x="24" y="950" font-family="Atkinson Hyperlegible" font-weight="700" font-size="17" fill="#1E2A3A" text-anchor="start">Mascota y botones</text><text x="24" y="972" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Sin parpadeo, vaivén ni transiciones.</text><text x="24" y="1014" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">Automático por defecto: sigue a «reducir</text><text x="24" y="1036" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">movimiento» y al ahorro de datos. Se puede forzar</text><text x="24" y="1058" font-family="Atkinson Hyperlegible" font-weight="400" font-size="15" fill="#4A6576" text-anchor="start">y se guarda en el dispositivo.</text></svg>