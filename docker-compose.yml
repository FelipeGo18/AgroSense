# Servicios de AgroSense para desarrollo y pruebas (HU-021, HU-161).
# La base de datos de las cuentas y la API. `web` se agrega con su primera HU; en desarrollo la web corre con `npm run dev`.
# La base del equipo y de la demo está en la nube (AGROSENSE_DATABASE_URL en el .env); `db` es la local, la de las
# pruebas y la de trabajar sin conexión.
#
#   cp .env.example .env
#   docker compose up -d db        # arranca PostgreSQL en 127.0.0.1:5432
#   docker compose up app          # con la base local: la copia, aplica las migraciones y deja la API en http://localhost:8000
#                                  # con la de la nube: solo la usa; las migraciones se aplican a mano
#   docker compose up --no-deps app                # la API sola, sin base de datos: las cuentas responden 503
#   docker compose run --rm app uv run pytest      # pruebas
#   docker compose down            # lo apaga y conserva los datos
#   docker compose down -v         # lo apaga y borra los datos (volumen `db_data`)

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    ports:
      # Solo esta máquina: la base de datos no queda a la vista de la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Los datos viven en este volumen de Docker, en la máquina de cada quien. No van a git ni dentro de la imagen.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      # `up app` levanta también la base de datos y la espera. Pero no es obligatoria: si la base no arranca, la API
      # sube igual, con las cuentas apagadas. Para probar la API sola: docker compose up --no-deps app
      db:
        condition: service_healthy
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      # Dentro de Compose la base de datos se llama `db` y escucha en su puerto normal. Las pruebas usan siempre esta.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # La base en la nube. Con ella en el .env, la API usa esa base en vez de `db`, no la migra sola al
      # arrancar y exige SSL. Vacía: la base local. Ver backend/README.md, «Base de datos en la nube».
      AGROSENSE_DATABASE_URL: ${AGROSENSE_DATABASE_URL:-}
      AGROSENSE_AUTO_MIGRATE: ${AGROSENSE_AUTO_MIGRATE:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173}
      AGROSENSE_LOG_LEVEL: ${AGROSENSE_LOG_LEVEL:-INFO}
      AGROSENSE_LOG_FORMAT: ${AGROSENSE_LOG_FORMAT:-console}
      # Compose es para desarrollo y pruebas: la documentación de la API queda encendida. En producción, false.
      AGROSENSE_API_DOCS: ${AGROSENSE_API_DOCS:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Las copias de seguridad que se hacen antes de cada migración quedan en su máquina, no dentro del contenedor.
      - ./backups:/app/backups
      # Las versiones de precios que deja el servicio `market`: la API solo las lee (HU-222).
      - market_data:/app/data/market:ro

  # Precios de SIPSA al día (HU-222): dos crons con supercronic, en la hora de Bogotá. El diario baja el anexo del boletín
  # del DANE (unos 340 KB) y el semanal la serie completa del servicio web (unos 300 MB). Con el perfil `market` no
  # arranca con `docker compose up`, para no usar la red en cada equipo:
  #   docker compose --profile market up -d market                            # encenderlo
  #   docker compose --profile market run --rm market python -m backend.market.updates diario   # correr uno ya
  market:
    build: .
    profiles: ["market"]
    restart: unless-stopped
    # No usa la base de datos: lee su configuración de `pipeline/settings.py`, que no la pide.
    environment:
      AGROSENSE_LOG_LEVEL: ${AGROSENSE_LOG_LEVEL:-INFO}
      AGROSENSE_LOG_FORMAT: ${AGROSENSE_LOG_FORMAT:-console}
      AGROSENSE_MARKET_DAILY_SCHEDULE: ${AGROSENSE_MARKET_DAILY_SCHEDULE:-0 15 * * 1-5}
      AGROSENSE_MARKET_WEEKLY_SCHEDULE: ${AGROSENSE_MARKET_WEEKLY_SCHEDULE:-0 15 * * 0}
      AGROSENSE_MARKET_TIMEOUT_S: ${AGROSENSE_MARKET_TIMEOUT_S:-900}
      AGROSENSE_MARKET_MAX_MB: ${AGROSENSE_MARKET_MAX_MB:-600}
      TZ: America/Bogota
    volumes:
      - market_data:/app/data/market
    # Al arrancar: se pone al día con el boletín (es liviano) y deja los dos horarios del .env en el crontab de
    # supercronic. El candado no se borra: si hay una actualización corriendo a mano, la del arranque no corre (el log
    # dice por qué) y supercronic arranca igual; un candado de más de 6 horas se da por muerto (`LOCK_STALE_S` en
    # backend/market/updates.py).
    command:
      - sh
      - -c
      - >-
        python -m backend.market.updates diario;
        printf '%s python -m backend.market.updates diario\n%s python -m backend.market.updates semanal\n'
        "$$AGROSENSE_MARKET_DAILY_SCHEDULE" "$$AGROSENSE_MARKET_WEEKLY_SCHEDULE" > /tmp/precios.cron
        && exec supercronic /tmp/precios.cron
  
  # Lint, pruebas y build de todo el repo con un solo comando (HU-022):
  #   docker compose run --rm test
  # Corre scripts/test.sh dentro de la imagen Dockerfile.test: Ruff, pytest (contra `db`) y Vitest + build de la web.
  # Con el perfil `test` no arranca con `docker compose up`: solo con `run`. Lo mismo lo ejecuta el CI (ci.yml).
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    depends_on:
      #Levanta PostgreSQL y espera a que responda antes de empezar las pruebas.
      db:
        condition: service_healthy
    working_dir: /repo
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      #Dentro de Compose la base se llama `db` y escucha en su puerto normal.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Fijo y vacío: las pruebas nunca usan la base de la nube, venga lo que venga del .env.
      AGROSENSE_DATABASE_URL: ""
      AGROSENSE_AUTO_MIGRATE: ""
    volumes:
      #Todo el repo, no solo web/: la web importa archivos de design/ (fuera de web/) y sin ellos fallan las pruebas.
      - .:/repo
      #node_modules en un volumen aparte
      - web_node_modules:/repo/web/node_modules
    command: ["bash", "scripts/test.sh"]

volumes:
  db_data:
  market_data:
  web_node_modules:
