# Región del dataset publicado y versión del dataset (HU-044; specs/02-contratos.md, «Tablas publicadas»).
#
# Región piloto confirmada el 28 de octubre de 2026 con la sede de Duitama (HU-002): altiplano de Boyacá y
# Cundinamarca, en Colombia. Lo propio de Colombia vive en esta configuración y en los adaptadores; el modelo no (R7).
#
# `dataset_version` sube a mano cada vez que cambia lo publicado (R4): mismos datos y misma versión dan lo mismo.

dataset_version: "2026.11.8"
region:
  id: co-boyaca-cundinamarca
  name: "Boyacá y Cundinamarca, Colombia"
  country: CO
  # Códigos DIVIPOLA de departamento (2 dígitos).
  departments: ["15", "25"]
  # Centrales de abastos de SIPSA cuyos precios se publican (HU-221): código de la central en SIPSA (`fuenId`) y el
  # nombre que se muestra («Nombre corto (detalle)»: la web usa el nombre corto en los botones). Corabastos es el
  # mercado de referencia del altiplano; Tunja, el de Boyacá.
  markets:
    "1": "Corabastos (Bogotá)"
    "9": "Tunja (Complejo de Servicios del Sur)"

# Periodo normal del clima (HU-044; decidido por Felipe el 10 de noviembre de 2026): uno solo para todo lo que se compara
# con una normal. 1991-2020 es el periodo de referencia de la OMM y el de las normales del IDEAM, que siguen sus
# «Directrices sobre el cálculo de las normales climáticas» (OMM-N.º 1203, 2017); 24 años son el 80 % del periodo. Un
# año, o un mes, cuenta si tiene al menos el 90 % de sus días con dato: los que faltan no se rellenan (R1).
climate_normal:
  first_year: 1991
  last_year: 2020
  min_years: 24
  min_day_share: 0.9

# Gradiente térmico (HU-044): cuántos °C baja la temperatura por cada metro que se sube. Corrige las temperaturas de
# NASA POWER, cuya celda de unos 50 km puede estar cientos de metros más arriba o más abajo que el municipio.
# Es propio de la región (R7): región Andina de Colombia, tabla 3 de Chaves y Jaramillo (1999), con 133 estaciones
# entre 100 y 4482 m: Tmax = 33,97 − 0,0058·A (R² 0,86) y Tmin = 23,97 − 0,0059·A (R² 0,92), con A en metros.
temperature_lapse_rate:
  temp_max_c_per_m: 0.0058
  temp_min_c_per_m: 0.0059
  source:
    source_id: cenicafe_lapse_rate
    name: "Regionalización de la temperatura del aire en Colombia (Chaves Córdoba y Jaramillo Robledo, 1999), tabla 3"
    institution: "Centro Nacional de Investigaciones de Café (Cenicafé)"
    url: "https://revistas.unal.edu.co/index.php/arh/article/view/92185"
    downloaded_at: "2026-11-09"
    period_covered: null
    coverage: "Región Andina de Colombia, de 100 a 4482 m"
    license: null
    citation: "Chaves Córdoba, B. y Jaramillo Robledo, A. (1999). Regionalización de la temperatura del aire en Colombia. Avances en Recursos Hidráulicos, 6, 37-42."
    notes: "Avances en Recursos Hidráulicos, n.º 6 (septiembre de 1999), pp. 37-42. Pendiente de la temperatura máxima media (0,0058 °C/m) y de la mínima media (0,0059 °C/m) con la altitud en la región Andina. Se usa para corregir por altitud las temperaturas de NASA POWER."
