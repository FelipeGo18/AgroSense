# Región del dataset publicado y versión del dataset (HU-044; specs/02-contratos.md, «Tablas publicadas»).
#
# Región piloto confirmada el 28 de octubre de 2026 con la sede de Duitama (HU-002): altiplano de Boyacá y
# Cundinamarca, en Colombia. Lo propio de Colombia vive en esta configuración y en los adaptadores; el modelo no (R7).
#
# `dataset_version` sube a mano cada vez que cambia lo publicado (R4): mismos datos y misma versión dan lo mismo.

dataset_version: "2026.11.2"
region:
  id: co-boyaca-cundinamarca
  name: "Boyacá y Cundinamarca, Colombia"
  country: CO
  # Códigos DIVIPOLA de departamento (2 dígitos).
  departments: ["15", "25"]
  # Centrales de abastos de SIPSA cuyos precios se publican (HU-221): código de la central en SIPSA (`fuenId`) y el
  # nombre que se muestra («Nombre corto (detalle)»: la web usa el nombre corto en los botones). Corabastos es el
  # mercado de referencia del altiplano; Tunja, el de Boyacá.
  markets:
    "1": "Corabastos (Bogotá)"
    "9": "Tunja (Complejo de Servicios del Sur)"
