[project]
name = "agrosense"
version = "0.0.0"
description = "AgroSense: backend (API, cuentas y motor de decisión)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "fastapi>=0.115",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyproj>=3.6",
    "pyyaml>=6.0.3",
    "shapely>=2.0",
    "sqlalchemy>=2.0.30",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["design", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # Depends(...) en los valores por defecto es el uso normal de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"backend/db/migrations/versions/*" = ["E501"]
